/* Template Architecture V2 — restaurant-signature · spec 2.0.0 */
:root {

  --color-secondary: #2D5A45;

  --border-copper: rgba(184,115,51,0.35);

/* V2 language profile — RTL typography adaptation */
[dir="rtl"] {
  --font-display: "Noto Naskh Arabic", ui-serif, Georgia, serif;
  --font-body: "Noto Sans Arabic", ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 0.01em;
}

.v2-layout-sidebar-left .v2-sidebar-shell { gap: 0; }
.v2-sidebar-rail { border-inline-end: 1px solid var(--border-default, rgba(255,255,255,0.12)); }

.v2-main-canvas > [data-v2-component] + [data-v2-component] { margin-top: 0; }

:root {
