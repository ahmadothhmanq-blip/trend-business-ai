<style>@tailwind base;

/* Template Architecture V2 — restaurant-signature · spec 2.0.0 */
:root {
  --v2-package: "restaurant-signature";
  --color-primary: #1A3D32;
  --color-secondary: #264A3E;
  --color-accent: #B87333;
  --color-background: #0A1210;
  --color-foreground: #F4EDE4;
  --color-muted: rgba(244,237,228,0.58);
  --color-surface: #121F1A;
  --color-copper: #D4A574;
  --color-ember: #8B5A2B;
  --color-linen: #FFFCF7;
  --font-display: "Cormorant Garamond", ui-sans-serif, system-ui, sans-serif;
  --font-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --spacing-unit: 0.25rem;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --shadow-surface: 0 32px 80px rgba(0,0,0,0.55);
  --shadow-glow: 0 0 100px rgba(212,165,116,0.14);
  --shadow-inset: inset 0 1px 0 rgba(244,237,228,0.06);
  --border-default: rgba(244,237,228,0.1);
  --border-copper: rgba(212,165,116,0.32);
  --border-subtle: rgba(244,237,228,0.06);
}

/* V2 language profile — RTL typography adaptation */
[dir="rtl"] {
  --font-display: Amiri, ui-serif, Georgia, serif;
  --font-body: "Noto Sans Arabic", ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 0.01em;
}

@import url("https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Noto+Sans+Arabic:wght@400;500;600&display=swap");

@keyframes rs-reveal-hero {
  from { opacity: 0; transform: translateY(36px); filter: blur(6px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes rs-reveal-section {
  from { opacity: 0; transform: translateY(28px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes rs-draw-line {
  from { transform: scaleX(0); opacity: 0; }
  to { transform: scaleX(1); opacity: 1; }
}
@keyframes rs-scroll-pulse {
  0%, 100% { opacity: 0.35; transform: scaleY(0.6); }
  50% { opacity: 1; transform: scaleY(1); }
}
@keyframes rs-ken-burns {
  from { transform: scale(1.04); }
  to { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .v2-motion, [data-v2-motion] { animation: none !important; transition: none !important; }
}

.rs-font-display { font-family: var(--font-display), "Cormorant Garamond", Georgia, serif; }
.rs-font-body { font-family: var(--font-body), "DM Sans", system-ui, sans-serif; }
.rs-eyebrow {
  font-family: var(--font-body), "DM Sans", system-ui, sans-serif;
  font-size: 0.625rem;
  font-weight: 500;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--color-copper, #D4A574);
}
.rs-headline {
  font-family: var(--font-display), "Cormorant Garamond", Georgia, serif;
  font-size: clamp(2.5rem, 5.5vw, 4.25rem);

  line-height: 1.75;
  color: color-mix(in srgb, var(--color-foreground) 68%, transparent);
}
.rs-copper-rule {
  height: 1px;
  width: 4rem;
  background: linear-gradient(90deg, var(--color-copper, #D4A574), transparent);
  transform-origin: left;
}
[dir="rtl"] .rs-copper-rule { transform-origin: right; }
.rs-btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 2.75rem;
  padding: 0.875rem 2rem;
  font-family: var(--font-body), "DM Sans", system-ui, sans-serif;
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--color-linen, #FFFCF7);
  background: var(--color-accent, #B87333);
  border: 1px solid color-mix(in srgb, var(--color-copper) 40%, transparent);
  transition: background 0.4s ease, box-shadow 0.4s ease, transform 0.35s ease;
}
.rs-btn-primary:hover {
  background: var(--color-copper, #D4A574);
  box-shadow: var(--shadow-glow);
}
.rs-btn-primary:focus-visible {
  outline: 2px solid var(--color-copper);
  outline-offset: 3px;
}
.rs-btn-ghost {
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: 0.875rem 1.75rem;
  font-family: var(--font-body), "DM Sans", system-ui, sans-serif;
  font-size: 0.625rem;
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  text-decoration: none;
  color: color-mix(in srgb, var(--color-foreground) 85%, transparent);
  border: 1px solid var(--border-copper, rgba(212,165,116,0.32));
  background: transparent;
  transition: border-color 0.35s ease, color 0.35s ease;
}
.rs-btn-ghost:hover { border-color: var(--color-copper); color: var(--color-copper); }
.rs-btn-ghost:focus-visible { outline: 2px solid var(--color-copper); outline-offset: 3px; }
.rs-section { padding-block: clamp(5rem, 12vw, 8rem); }
.rs-grain::after {
  content: "";
  pointer-events: none;
  position: absolute;
  inset: 0;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.rs-focus-ring:focus-visible { outline: 2px solid var(--color-copper); outline-offset: 2px; }
/* V2 sidebar-left layout */
.v2-layout-sidebar-left .v2-sidebar-shell { gap: 0; align-items: flex-start; }
.v2-sidebar-rail {
  border-inline-end: 1px solid var(--border-subtle, rgba(244,237,228,0.06));
  padding-block: clamp(2rem, 5vw, 3.5rem);
  padding-inline-end: clamp(1.25rem, 3vw, 2rem);
}
[dir='rtl'] .v2-sidebar-rail { border-inline-end: none; border-inline-start: 1px solid var(--border-subtle, rgba(244,237,228,0.06)); }
.v2-main-canvas > [data-v2-component] + [data-v2-component] { margin-top: 0; }
.v2-layout-sidebar-left .v2-main-canvas { padding-inline-start: 0; }
@media (max-width: 1023px) {
  .v2-sidebar-rail { display: none !important; }
}

:root {
  --container-max: 90rem;
  --font-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Cormorant Garamond", ui-sans-serif, system-ui, sans-serif;
  --color-surface: #121F1A;
  --color-foreground: #F4EDE4;
  --color-background: #0A1210;
  --color-accent: #B87333;
  --color-secondary: #264A3E; --color-primary: #1A3D32; }
</style>
